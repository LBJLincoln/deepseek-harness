# Test-only composition: one program of the Daliesk Village that builds a real
# command line — three departments, one git worktree and session each, an
# integration over the merged head, and a ledger in the program's own session.
#
# This file is the keyless half: the departments run on the scripted `cli-mock`
# route below, so the whole workflow executes with no key and no product
# installation. `overlays/claude-code.cordis.yml` is the same composition with
# the operator's Claude Code route in its place, which is the one the real run
# boots; nothing else differs between the two.
- id: csv-tools-llm
  name: './csv-tools-llm.ts'

# Managed child-process groups for the bash executor (spawn/kill/output plumbing).
- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: bash
  name: '@deepseek-ai/dsh-bash-local'

- id: fs
  name: '@deepseek-ai/dsh-fs-local'
  config:
    cwd: !!js process.cwd()

# The barrier the program denies its integration session the department
# worktrees with; the fs gate is what refuses the read in the operation that
# opens paths. The self-assessment run of 2026-09-08 had no barrier, and its
# unconfined integration session edited a department's certified file.
- id: read-barrier
  name: '@deepseek-ai/dsh-read-barrier'

- id: fs-read-barrier
  name: '@deepseek-ai/dsh-fs-read-barrier'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: goal
  name: '@deepseek-ai/dsh-goal'
  config:
    defaultMaxGoalRounds: 11

# Composed beside the program, which disarms every goal it creates: a department
# an operator resumes by hand is driven by this row instead.
- id: goal-round-driver
  name: '@deepseek-ai/dsh-goal-round-driver'

- id: verification
  name: '@deepseek-ai/dsh-verification'
  config:
    maxChecks: 32
    maxTextChars: 2048

# The roster's root is absolute: the smoke runs in an isolated temporary cwd, so
# the presets beside this file are reachable only through the path the driver exports.
- id: agent-presets
  name: '@deepseek-ai/dsh-agent-presets'
  config:
    default: implementing
    roots:
      - path: !!js process.env.DSH_TEST_PROGRAM_PRESETS
        trust: system
    includeUserRoot: false

# The route every department session is created with. The overlay replaces this
# entry, and only this entry, to put a product model in the departments' place.
- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: cli-mock
    model: cli-mock

# Village rule: a composition that runs unattended sessions carries a session
# budget. The caps are far out of reach of the scripted route, so no department
# breaches them before its own `budget/caps` record tightens them.
- id: budget-policy
  name: '@deepseek-ai/dsh-budget-policy'
  config:
    maxTotalTokens: 3000000
    maxWallMs: 1800000

- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    persona: 'You build one part of a small command-line program on its own branch, against a specification and a committed test suite you do not change.'
    workspaceContext: false

# The ledger and every department log outlive the process, so a restarted run
# reconciles from the same root the first pass wrote.
- id: persistence
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.DSH_TEST_SESSION_ROOT ?? './.sessions'
    compression: none

- id: checkpoint-policy
  name: '@deepseek-ai/dsh-session-checkpoint-policy'

# The two signatures the program's `requireSignoff` reads are recorded on the
# program session by the driver, through this service, before `start` opens it.
- id: signoff
  name: '@deepseek-ai/dsh-signoff'
  config:
    maxEvidence: 8
    maxEvidenceRefChars: 512

- id: program
  name: '@deepseek-ai/dsh-program'
  config:
    workspaceRoot: !!js process.env.DSH_TEST_PROGRAM_REPO
    requireSignoff: true
    # One department at a time keeps the ledger's order a property of the spec
    # rather than of the host's scheduling.
    maxConcurrentGoals: 1
    # A department spends one round writing and committing; the `join`
    # department spends a second one after the uncommitted-work directive.
    maxGoalRounds: 3
    branchPrefix: program
    evidenceMaxChars: 512

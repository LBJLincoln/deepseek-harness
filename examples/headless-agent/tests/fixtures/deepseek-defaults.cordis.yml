- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ../../cordis.yml
    patches:
      - id: llm-deepseek
        config:
          baseURL: !!js process.env.DSH_SNAPSHOT_BASE_URL
          thinking: disabled
          # Paired with the snapshot server's keep-alive cadence: comments arrive
          # far inside this window and the completion lands past it, so the run
          # proves comments reset the idle timer. Widening both together is what
          # keeps a delayed timer on a loaded host from reading as a `TIMEOUT`.
          streamIdleTimeoutMs: 800
      - id: agent-spine
        config:
          agents:
            - id: main
              provider: deepseek-official
              model: deepseek-v4-flash
              cwd: !!js process.cwd()
          workspaceContext: false
          persona: 'Keyless DeepSeek adapter defaults snapshot.'
      - id: persistence
        config:
          root: './.sessions'

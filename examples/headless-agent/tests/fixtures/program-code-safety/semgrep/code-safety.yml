# Local Semgrep rules for the code-safety program's JavaScript and TypeScript
# departments. They are deliberately few and deliberately coarse: a department
# treats a hit as a place to read, never as a finding, and every finding it
# reports still quotes the target's own line and is checked by
# `verify-safety-report.mjs`.
#
# The set is local so a run needs no registry and no network. A real run may
# add registry packs on top — `semgrep --config p/owasp-top-ten --config
# <this directory> --metrics off --json` — and the report states which configs
# actually ran.
rules:
  - id: dsh-eval-on-input
    languages: [javascript, typescript]
    severity: ERROR
    message: eval-family call; anything reaching it runs as code (CWE-95).
    metadata:
      cwe: CWE-95
      owasp: 'A03:2021 Injection'
    patterns:
      - pattern-either:
          - pattern: eval(...)
          - pattern: new Function(...)
          - pattern: setTimeout("...", ...)
          - pattern: setInterval("...", ...)

  - id: dsh-child-process-interpolation
    languages: [javascript, typescript]
    severity: ERROR
    message: Shell command built by interpolation; an argument that carries a shell metacharacter runs as a command (CWE-78).
    metadata:
      cwe: CWE-78
      owasp: 'A03:2021 Injection'
    patterns:
      - pattern-either:
          - pattern: $CP.exec(`...${$X}...`, ...)
          - pattern: $CP.execSync(`...${$X}...`, ...)
          - pattern: $CP.exec("..." + $X, ...)
          - pattern: $CP.execSync("..." + $X, ...)

  - id: dsh-string-built-query
    languages: [javascript, typescript]
    severity: ERROR
    message: Query text built by concatenation or interpolation; a value that reaches it changes the query (CWE-89).
    metadata:
      cwe: CWE-89
      owasp: 'A03:2021 Injection'
    pattern-regex: '(?i)(select|insert into|update|delete from)\s[^"''`\n]*("\s*\+|''\s*\+|\$\{)'

  - id: dsh-mongo-where
    languages: [javascript, typescript]
    severity: ERROR
    message: MongoDB `$where` runs JavaScript on the server; an interpolated value runs with it (CWE-943).
    metadata:
      cwe: CWE-943
      owasp: 'A03:2021 Injection'
    pattern-regex: '\$where\s*:'

  - id: dsh-html-sink
    languages: [javascript, typescript]
    severity: WARNING
    message: HTML sink assigned unescaped text; a value that reaches it becomes markup (CWE-79).
    metadata:
      cwe: CWE-79
      owasp: 'A03:2021 Injection'
    patterns:
      - pattern-either:
          - pattern: $EL.innerHTML = $X
          - pattern: $EL.outerHTML = $X
          - pattern: document.write(...)
          - pattern: $EL.insertAdjacentHTML(...)

  - id: dsh-weak-hash
    languages: [javascript, typescript]
    severity: WARNING
    message: Broken or fast hash; unusable for passwords and unsafe for integrity (CWE-327, CWE-916).
    metadata:
      cwe: CWE-327
      owasp: 'A02:2021 Cryptographic Failures'
    patterns:
      - pattern-either:
          - pattern: $C.createHash("md5")
          - pattern: $C.createHash("sha1")

  - id: dsh-hardcoded-secret
    languages: [javascript, typescript]
    severity: ERROR
    message: Literal that reads as a credential; a committed secret is disclosed to everyone with the repository (CWE-798).
    metadata:
      cwe: CWE-798
      owasp: 'A07:2021 Identification and Authentication Failures'
    pattern-regex: '(?i)(password|passwd|secret|token|api[_-]?key|private[_-]?key|access[_-]?key)\s*[:=]\s*["''][^"''$\n]{8,}["'']'

  - id: dsh-permissive-cors
    languages: [javascript, typescript]
    severity: WARNING
    message: CORS allows every origin; with credentials allowed too, any site reads authenticated responses (CWE-942).
    metadata:
      cwe: CWE-942
      owasp: 'A05:2021 Security Misconfiguration'
    pattern-regex: 'Access-Control-Allow-Origin["'']\s*,\s*["'']\*'

  - id: dsh-insecure-cookie
    languages: [javascript, typescript]
    severity: WARNING
    message: Session cookie without httpOnly or without secure; script-readable or sent in clear (CWE-1004, CWE-614).
    metadata:
      cwe: CWE-1004
      owasp: 'A05:2021 Security Misconfiguration'
    patterns:
      - pattern-either:
          - pattern-regex: 'httpOnly\s*:\s*false'
          - pattern-regex: 'secure\s*:\s*false'

  - id: dsh-cleartext-endpoint
    languages: [javascript, typescript]
    severity: WARNING
    message: Cleartext HTTP endpoint in configuration or code; anything sent to it is readable in transit (CWE-319).
    metadata:
      cwe: CWE-319
      owasp: 'A02:2021 Cryptographic Failures'
    pattern-regex: '["'']http://(?!localhost|127\.0\.0\.1)[^"''\s]+["'']'

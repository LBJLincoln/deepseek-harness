# Test-only composition: one program of the Daliesk Village that reviews a
# target tree for code-safety defects — six departments, one git worktree and
# session each, an integration over the merged head, and a ledger in the
# program's own session.
#
# This file is the keyless half: the departments run on the scripted `cli-mock`
# route below, against the committed `sample-target/`, so the whole workflow
# executes with no key and no network. `overlays/claude-code.cordis.yml` is the
# same composition with the operator's Claude Code route in its place, which is
# the one a real review boots.
- id: code-safety-llm
  name: './code-safety-llm.ts'

# Managed child-process groups for the bash executor (spawn/kill/output plumbing).
- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: bash
  name: '@deepseek-ai/dsh-bash-local'

- id: fs
  name: '@deepseek-ai/dsh-fs-local'
  config:
    cwd: !!js process.cwd()

# The barrier the program denies its integration session the department
# worktrees with; the fs gate is what refuses the read in the operation that
# opens paths. It does not make the target tree read-only — no capability here
# does — which is why the base commit carries `target.json` and the committed
# examiner re-hashes every locked file on every run.
- id: read-barrier
  name: '@deepseek-ai/dsh-read-barrier'

- id: fs-read-barrier
  name: '@deepseek-ai/dsh-fs-read-barrier'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

# A department reads a tree it did not write, so `glob` and `grep` are how it
# finds what to open. An over-cap page is sampled across top-level entries
# rather than taking the newest files: a review's first pass wants breadth.
- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: true

- id: goal
  name: '@deepseek-ai/dsh-goal'
  config:
    defaultMaxGoalRounds: 11

# Composed beside the program, which disarms every goal it creates: a department
# an operator resumes by hand is driven by this row instead.
- id: goal-round-driver
  name: '@deepseek-ai/dsh-goal-round-driver'

- id: verification
  name: '@deepseek-ai/dsh-verification'
  config:
    maxChecks: 32
    maxTextChars: 4096

# The roster's root is absolute: the smoke runs in an isolated temporary cwd, so
# the presets beside this file are reachable only through the path the driver
# exports. `integrating` is the default because the integration session is
# created with no preset of its own.
- id: agent-presets
  name: '@deepseek-ai/dsh-agent-presets'
  config:
    default: integrating
    roots:
      - path: !!js process.env.DSH_CODE_SAFETY_PRESETS
        trust: system
    includeUserRoot: false

# The route every department session is created with. The overlay replaces this
# entry, and only this entry, to put a product model in the departments' place.
- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: cli-mock
    model: cli-mock

# Village rule: a composition that runs unattended sessions carries a session
# budget. The caps are far out of reach of the scripted route, so no department
# breaches them before its own `budget/caps` record tightens them.
- id: budget-policy
  name: '@deepseek-ai/dsh-budget-policy'
  config:
    maxTotalTokens: 6000000
    maxWallMs: 3600000

- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    persona: 'You review code you did not write for security defects, on your own branch, and you report only what you have read.'
    workspaceContext: false

# The ledger and every department log outlive the process, so a restarted run
# reconciles from the same root the first pass wrote.
- id: persistence
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.DSH_TEST_SESSION_ROOT ?? './.sessions'
    compression: none

- id: checkpoint-policy
  name: '@deepseek-ai/dsh-session-checkpoint-policy'

# The two signatures the program's `requireSignoff` reads are recorded on the
# program session by the driver, through this service, before `start` opens it.
- id: signoff
  name: '@deepseek-ai/dsh-signoff'
  config:
    maxEvidence: 8
    maxEvidenceRefChars: 512

- id: program
  name: '@deepseek-ai/dsh-program'
  config:
    workspaceRoot: !!js process.env.DSH_CODE_SAFETY_REPORT_REPO
    requireSignoff: true
    # One department at a time keeps the keyless ledger's order a property of
    # the spec rather than of the host's scheduling; the overlay raises it,
    # because six departments reading one tree have nothing to serialize on.
    maxConcurrentGoals: 1
    # A department spends one round reading and committing. The integration
    # spends its first round discovering that no report exists yet, because its
    # checks run before its first turn.
    maxGoalRounds: 4
    branchPrefix: safety
    # The examiner's failures are the only instruction a department gets between
    # attempts, so the evidence bound has to carry several of them whole.
    evidenceMaxChars: 4096

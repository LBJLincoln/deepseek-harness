# Test-only composition: one experiment over the training-eligible environments of the environment-run fixture, both arms on the same route, then a trajectory export that proves the stamped groups.
- id: cli-mock-llm
  name: '../cli-mock-llm.ts'

# Managed child-process groups for the bash executor (spawn/kill/output plumbing).
- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: bash
  name: '@deepseek-ai/dsh-bash-local'

- id: goal
  name: '@deepseek-ai/dsh-goal'
  config:
    defaultMaxGoalRounds: 11

- id: verification
  name: '@deepseek-ai/dsh-verification'
  config:
    maxChecks: 32
    maxTextChars: 2048

- id: environments
  name: '@deepseek-ai/dsh-environments'

- id: register-environments
  name: '../environment-run/register-environments.ts'

# The runner creates its own agent per cell from this selection; both arms of the
# experiment run this one route, so the comparison is a calibration with no effect to find.
- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: cli-mock
    model: cli-mock

- id: environment-runner
  name: '@deepseek-ai/dsh-environment-runner'
  config:
    isolation: none
    maxAttempts: 2
    evidenceMaxChars: 512

- id: fleet
  name: '@deepseek-ai/dsh-fleet'
  config:
    maxConcurrent: 2
    workspaceRetention: keep

- id: experiments
  name: '@deepseek-ai/dsh-experiments'
  config:
    bootstrapResamples: 200
    confidenceLevel: 0.95
    minimumDelta: 0
    cellTokenCap: 20000
    tokenBudget: 200000

- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    persona: 'Run registered environments as validated sessions.'
    workspaceContext: false

- id: persistence
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: './.sessions'
    compression: none

- id: checkpoint-policy
  name: '@deepseek-ai/dsh-session-checkpoint-policy'

- id: trajectories
  name: '@deepseek-ai/dsh-trajectories'

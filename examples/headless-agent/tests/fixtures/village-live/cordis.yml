# The live Proving Ground: one district running on its cadence with the real
# Claude Code product as the implementer of every cell, over four small program
# tasks whose own test suites are the standard (register-environments.ts).
#
# The route below is never sampled: a delegated cell drives no turn of its own
# model. It is composed because the runner still creates one cell agent per
# cell, and that agent's session is where the stamp, the standard, the
# delegation records, and the certificate live; its catalog names the product
# model the cell is stamped with, which the delegation forwards to the child.
- id: llm-claude-code
  name: '@deepseek-ai/dsh-llm-claude-code'
  config:
    provider: claude-code
    models:
      - id: sonnet
        name: Claude Code sonnet
        productModel: sonnet
        contextWindow: 200000

# Managed child-process groups for the bash executor and for the product CLI the
# Claude Code provider spawns. The provider's spawn is not confined: the product
# brings its own tool stack and its own account state, which is why a delegated
# cell can only claim `isolation: none`.
- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: sandbox
  name: '@deepseek-ai/dsh-sandbox-local'

# The cell agent's own bash runs confined to the cell workspace even though the
# work of each cell happens in the product: the harness-side session is the one
# this process can fence. The configured root is the fallback for agentless
# calls, which is what the runner's own check commands make.
- id: sandbox-policy
  name: '@deepseek-ai/dsh-sandbox-policy'
  config:
    mode: workspace-write
    workspaceRoot: !!js process.cwd()

- id: bash
  name: '@deepseek-ai/dsh-bash-sandbox'

# The filesystem provider is composed for the barrier and the sandbox policy,
# not for the model: no `dsh-tool-fs` here, so a cell agent still holds bash
# alone. The barrier denies each cell the run directory its workspace sits in —
# the plan, the shift's log, and the other cells of the same slot — for the
# length of its run, and the confined bash is where that denial lands.
- id: fs
  name: '@deepseek-ai/dsh-fs-local'

- id: read-barrier
  name: '@deepseek-ai/dsh-read-barrier'

- id: fs-read-barrier
  name: '@deepseek-ai/dsh-fs-read-barrier'

- id: goal
  name: '@deepseek-ai/dsh-goal'
  config:
    defaultMaxGoalRounds: 11

- id: verification
  name: '@deepseek-ai/dsh-verification'
  config:
    maxChecks: 32
    maxTextChars: 2048

- id: environments
  name: '@deepseek-ai/dsh-environments'

- id: register-environments
  name: './register-environments.ts'

- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: claude-code
    model: sonnet

- id: subagents
  name: '@deepseek-ai/dsh-subagent'

# No `env` overlay: the child resolves the host's own `claude` installation and
# runs on the account that installation already holds. An unattended program
# task needs the product to edit files and run the test command without a
# prompt, which is what `acceptEdits` and the `node` allowance grant; the
# provider registers its read-barrier refusal, which the `isolation: none`
# runner below asks nothing of.
- id: subagent-claude-code
  name: '@deepseek-ai/dsh-subagent-claude-code'
  config:
    permissionMode: acceptEdits
    allowedTools:
      - 'Bash(node:*)'

# `isolation: none` is the only claim an out-of-process implementer can serve:
# the read-barrier census cannot confine a foreign agent, and the runner refuses
# a higher claim over one.
- id: environment-runner
  name: '@deepseek-ai/dsh-environment-runner'
  config:
    isolation: none
    maxAttempts: 2
    evidenceMaxChars: 1024

- id: fleet
  name: '@deepseek-ai/dsh-fleet'
  config:
    maxConcurrent: 2
    workspaceRetention: keep

# Village rule: unattended cells carry a session budget. The caps bound the cell
# agent's own session, which a delegated cell barely uses; the external
# implementer's spend is outside every limit this harness enforces.
- id: budget-policy
  name: '@deepseek-ai/dsh-budget-policy'
  config:
    maxTotalTokens: 5000000
    maxWallMs: 1800000

- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    persona: 'Run registered environments as validated sessions.'
    workspaceContext: false

- id: persistence
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: './.sessions'
    compression: none

- id: checkpoint-policy
  name: '@deepseek-ai/dsh-session-checkpoint-policy'

# The terms every session of this district is pinned with at creation; they
# admit evaluation and never training, which is what the curator gates on.
- id: data-use
  name: '@deepseek-ai/dsh-data-use'
  config:
    clientId: daliesk-lab
    agreementId: village-live
    purposes:
      - delivery
      - evaluation
    residency: eu-west
    retentionDays: 90
    redactionProfile: village-v1

- id: session-projection
  name: '@deepseek-ai/dsh-session-projection'

- id: scorekeeper
  name: '@deepseek-ai/dsh-scorekeeper'
  config:
    passAtK:
      - 1

- id: observatory
  name: '@deepseek-ai/dsh-observatory'
  config:
    withhold:
      districts:
        - workshop
      heldOut: true
    staleAfterMs: 3600000
    refreshIntervalMs: 900000

- id: trajectories
  name: '@deepseek-ai/dsh-trajectories'

- id: curator
  name: '@deepseek-ai/dsh-curator'
  config:
    defaultProfile: village-v1
    profiles:
      village-v1:
        shipped: true

# One district, one slot every thirty minutes from process start; the held-out
# environment never enters the plan, and the implementer is frozen into the
# shift digest.
- id: shifts
  name: '@deepseek-ai/dsh-shifts'
  config:
    workspaceRoot: !!js process.cwd()
    startImmediately: true
    districts:
      - district: proving-ground
        plan:
          environments:
            filter:
              heldOut: false
          models:
            - provider: claude-code
              model: sonnet
          implementer:
            kind: subagent
            provider: claude-code
            label: external
          repetitions: 1
        cadence:
          intervalMs: 1800000

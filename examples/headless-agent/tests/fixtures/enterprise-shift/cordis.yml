# Test-only composition: one enterprise shift — one program whose departments
# are tickets of the repository's own queue, each in its own git worktree and
# session, an independent review per certified department, and an integration
# over the merged head — driven by `driver.ts` over a clone of the branch.
#
# This file is the keyless half: every session runs on the scripted `cli-mock`
# route below, so the whole shift executes with no key and no product
# installation. `overlays/claude-code.cordis.yml` is the same composition with
# the operator's Claude Code route in its place, which is what a real shift
# boots; nothing else differs between the two.
- id: enterprise-llm
  name: './enterprise-llm.ts'

# Managed child-process groups for the bash executor (spawn/kill/output plumbing).
- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: bash
  name: '@deepseek-ai/dsh-bash-local'

- id: fs
  name: '@deepseek-ai/dsh-fs-local'
  config:
    cwd: !!js process.cwd()

# The barrier the program denies its integration session the department
# worktrees with, and the one that denies the reviewer's judge role every
# directory and authority; the fs gate is what refuses the read.
- id: read-barrier
  name: '@deepseek-ai/dsh-read-barrier'

- id: fs-read-barrier
  name: '@deepseek-ai/dsh-fs-read-barrier'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: goal
  name: '@deepseek-ai/dsh-goal'
  config:
    defaultMaxGoalRounds: 11

# Composed beside the program, which disarms every goal it creates: a department
# an operator resumes by hand is driven by this row instead.
- id: goal-round-driver
  name: '@deepseek-ai/dsh-goal-round-driver'

# A failing acceptance command's evidence is test or typecheck output, and that
# evidence is the only instruction a department gets between attempts.
- id: verification
  name: '@deepseek-ai/dsh-verification'
  config:
    maxChecks: 32
    maxTextChars: 4096

# The roster's root is absolute: the smoke runs in an isolated temporary cwd, so
# the presets beside this file are reachable only through the path the driver exports.
- id: agent-presets
  name: '@deepseek-ai/dsh-agent-presets'
  config:
    default: implementing
    roots:
      - path: !!js process.env.DSH_ENTERPRISE_PRESETS
        trust: system
    includeUserRoot: false

# The route every session is created with. The overlay replaces this entry to
# put a product model in its place.
- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: cli-mock
    model: cli-mock

# Village rule: a composition that runs unattended sessions carries a session
# budget. A department's own caps are its ticket's budget, appended to its
# session by the program and tightened against these, so these are the ceiling
# no ticket may exceed.
- id: budget-policy
  name: '@deepseek-ai/dsh-budget-policy'
  config:
    maxTotalTokens: 8000000
    maxWallMs: 2700000

- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    persona: 'You work one ticket of a repository you did not write, in your own git worktree on your own branch, under the rules the repository states.'
    workspaceContext: false

# The ledger, the department logs and the review logs outlive the process: the
# shift copies them into its record from this root.
- id: persistence
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.DSH_ENTERPRISE_SESSIONS
    compression: none

- id: checkpoint-policy
  name: '@deepseek-ai/dsh-session-checkpoint-policy'

# The two signatures the program's `requireSignoff` reads are recorded on the
# program session by the driver, through this service, before `start` opens it.
- id: signoff
  name: '@deepseek-ai/dsh-signoff'
  config:
    maxEvidence: 8
    maxEvidenceRefChars: 512

- id: program
  name: '@deepseek-ai/dsh-program'
  config:
    workspaceRoot: !!js process.env.DSH_ENTERPRISE_REPO
    requireSignoff: true
    maxConcurrentGoals: 1
    # A department has one round to deliver and two to answer failing checks.
    maxGoalRounds: 3
    branchPrefix: program
    evidenceMaxChars: 4096

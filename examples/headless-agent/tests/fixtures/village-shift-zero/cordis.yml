# Keyless shift zero of the Daliesk Village on a mock route: two districts driven
# by the shift loop, priced usage, the scoreboard folded into the observatory
# page, and the trajectory export that withholds the Workshop.
- id: cli-mock-llm
  name: '../cli-mock-llm.ts'

# Managed child-process groups for the bash executor (spawn/kill/output plumbing).
- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: bash
  name: '@deepseek-ai/dsh-bash-local'

- id: goal
  name: '@deepseek-ai/dsh-goal'
  config:
    defaultMaxGoalRounds: 11

- id: verification
  name: '@deepseek-ai/dsh-verification'
  config:
    maxChecks: 32
    maxTextChars: 2048

- id: environments
  name: '@deepseek-ai/dsh-environments'

- id: register-environments
  name: '../environment-run/register-environments.ts'

# The runner creates its own agent per cell from this selection; the spine composes no agent of its own.
- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: cli-mock
    model: cli-mock

- id: environment-runner
  name: '@deepseek-ai/dsh-environment-runner'
  config:
    isolation: none
    maxAttempts: 2
    evidenceMaxChars: 512

- id: fleet
  name: '@deepseek-ai/dsh-fleet'
  config:
    maxConcurrent: 2
    routeBreaker:
      consecutiveErrors: 3
    workspaceRetention: remove-all

# Village rule: unattended cells carry a session budget; the mock route is priced
# so cost per certified session is a logged fact on the page.
- id: budget-policy
  name: '@deepseek-ai/dsh-budget-policy'
  config:
    maxTotalTokens: 5000000
    maxWallMs: 600000
    pricing:
      cli-mock/cli-mock:
        inputEurPerMillionTokens: 1
        outputEurPerMillionTokens: 2

- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    persona: 'Run registered environments as validated sessions.'
    workspaceContext: false

- id: persistence
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: './.sessions'
    compression: none

- id: checkpoint-policy
  name: '@deepseek-ai/dsh-session-checkpoint-policy'

- id: scorekeeper
  name: '@deepseek-ai/dsh-scorekeeper'
  config:
    passAtK:
      - 1
      - 2

# The Workshop is withheld from the public page and from the export.
- id: observatory
  name: '@deepseek-ai/dsh-observatory'
  config:
    withhold:
      districts:
        - workshop
      heldOut: true
    staleAfterMs: 3600000
    refreshIntervalMs: 900000

- id: trajectories
  name: '@deepseek-ai/dsh-trajectories'
  config:
    withheldDistricts:
      - workshop

# Two districts, each due at once; the cadence is a day so one process runs one
# slot per district and stops.
- id: shifts
  name: '@deepseek-ai/dsh-shifts'
  config:
    workspaceRoot: !!js process.cwd()
    startImmediately: true
    districts:
      - district: proving-ground
        plan:
          environments:
            filter:
              heldOut: false
          models:
            - provider: cli-mock
              model: cli-mock
          repetitions: 2
        cadence:
          intervalMs: 86400000
      - district: workshop
        plan:
          environments:
            ids:
              - smoke:round-trip
          models:
            - provider: cli-mock
              model: cli-mock
          repetitions: 1
        cadence:
          intervalMs: 86400000

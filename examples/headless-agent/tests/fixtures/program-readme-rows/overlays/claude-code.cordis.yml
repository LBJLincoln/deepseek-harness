# The readme-rows program with the operator's own Claude Code installation as
# the route the department is driven through: the real run, and the only file
# that differs from the keyless composition beside it.
#
# `implementer` stays `route`, so the program drives the department turn by turn
# through the LLM seam and the department's own session holds every step it
# took. The spec digest covers the implementer and the department's caps but not
# the route, so a real run is the keyless program's goal under a larger budget.
- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ../cordis.yml
    patches:
      # The scripted adapter is the keyless half's whole reason to exist; a real
      # run composes no mock route at all.
      - id: readme-rows-llm
        disabled: true
      # The department's caps, which the driver reads into the goal's budget. The
      # first real run spent the keyless 2,000,000 tokens in 29 steps of reading
      # this repository before its first attempt, because the cap counts billed
      # input and every step reads the whole conversation back from cache; the
      # wall cap stays. An id-targeted patch replaces the whole config, so both
      # fields are restated.
      - id: budget-policy
        config:
          maxTotalTokens: 8000000
          maxWallMs: 1500000
      - insert:
          - id: llm-claude-code
            name: '@deepseek-ai/dsh-llm-claude-code'
            config:
              provider: claude-code
              models:
                - id: sonnet
                  name: Claude Code sonnet
                  productModel: sonnet
                  contextWindow: 200000
                - id: opus
                  name: Claude Code opus
                  productModel: opus
                  contextWindow: 200000
              effort: high
      - id: agent-default-model
        config:
          provider: claude-code
          model: sonnet

# Keyless view of the bench with the completion family mounted beside the
# curated registrar: for a smoke that counts what both producers register
# without composing any model route. Same idea as registry-only.cordis.yml,
# plus register-completion-environments.
- id: environments
  name: '@deepseek-ai/dsh-environments'

- id: register-environments
  name: '../register-environments.ts'

- id: register-completion-environments
  name: '../register-completion-environments.ts'
  config:
    # Resolved against register-completion-environments.ts's own location
    # (the bench root), never against this overlay file's own directory.
    directory: './environments-completion'

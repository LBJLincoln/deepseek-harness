# The pwsh terminal-card lane swaps the shipped bash stack for the PowerShell
# twin: the bash executor row is disabled (patches cannot rename a row — `name`
# is a guard), the pwsh executor is inserted, and the `tool-pwsh` row the base
# bundle already carries (disabled off Windows, and again by the web-app
# bundle) is enabled rather than inserted a second time, which the loader
# refuses as a duplicate id. The permission service refuses an unconfined
# executor by design (presets bundle a sandbox mode), so its row is disabled
# too — this lane renders a seeded session, never a permission decision. The
# seeded scenario renders the logged pwsh call/result through the real tools on
# replay; no command executes, but the composition must boot the pwsh executor,
# so the lane skips on hosts without a usable `pwsh`.
- id: bash-sandbox
  name: '@deepseek-ai/dsh-bash-sandbox'
  disabled: true
- id: permission
  name: '@deepseek-ai/dsh-permission-presets'
  disabled: true
- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: false
- insert:
    - id: pwsh-local
      name: '@deepseek-ai/dsh-pwsh-local'

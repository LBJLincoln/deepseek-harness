name: Deploy command deck

# Publishes the Command Deck as a static export to this repository's GitHub
# Pages site, in replay mode over the committed fixtures: a demo URL that
# needs no feed, no key and no machine. The deck is the whole Pages site, so
# this deployment and the documentation workflow's replace each other: the
# documentation deploys from master, the deck from its branch.

on:
  push:
    branches: [claude/coding-agent-harness-u9l4gt]
    paths:
      - '.github/workflows/deck-pages.yml'
      - 'apps/command-deck/**'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm

      - name: Install the deck's dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --filter @deepseek-ai/dsh-command-deck

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Build the static export
        env:
          DECK_STATIC: '1'
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: pnpm --dir apps/command-deck run build

      - name: Keep the export's underscore directories out of Jekyll's hands
        run: touch apps/command-deck/out/.nojekyll

      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/command-deck/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

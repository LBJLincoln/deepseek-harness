name: Branch CI

# The repository's own CI gates on every push of the development branch. The
# main `ci.yml` runs its enterprise lanes on master pushes and pull requests
# only, on runner pools this fork does not have, so a branch that never opens a
# pull request would otherwise carry no CI at all. This workflow runs the same
# three gate groups (`check:ci:static`, `check:ci:coverage`,
# `check:ci:consumers`) on hosted `ubuntu-latest` runners, with worker counts
# sized for their four cores.
#
# A push that changes only transcript data starts no run: the capture loop
# (scripts/transcripts-capture.sh) pushes a commit of data/transcripts/live/
# every few minutes, and no gate reads the chunks, the raw trees or the derived
# datasets. The tools and the Markdown pairs under data/transcripts/ are not
# ignored, because the collector spec and doc-sync gate them.
on:
  push:
    branches: [claude/coding-agent-harness-u9l4gt]
    paths-ignore:
      - 'data/transcripts/live/**'
      - 'data/transcripts/*/raw/**'
      - 'data/transcripts/*/*.jsonl'
      - 'data/transcripts/*/stats.json'
  workflow_dispatch:

# A started run finishes; GitHub keeps only the newest pending run of the
# group behind it. The enterprise cycle pushes several times an hour, and
# cancelling the run in progress left no commit with a verdict.
concurrency:
  group: branch-ci-${{ github.ref }}
  cancel-in-progress: false

# No job holds more than it needs: each reads the repository to check it out
# and nothing else. Third-party actions are pinned to full commit SHAs, the
# release each SHA was tagged as named beside it.
permissions: {}

env:
  PRIMARY_NODE_VERSION: '24'
  # CI runs must never report to the production telemetry endpoint baked
  # into apps/cli/cordis.yml (AppCLIEntry disables the row when set).
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  static:
    runs-on: ubuntu-latest
    name: node 24 / static
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      DSH_GATE_CONCURRENCY: '2'
    steps:
      # Full history: the archive gate and the ledger gate read their trusted
      # base from the checkout.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Configure pnpm store path
        id: pnpm-store
        run: |
          store_root="$HOME/.local/share/pnpm/store"
          echo "PNPM_CONFIG_STORE_DIR=$store_root" >> "$GITHUB_ENV"
          store_path=$(PNPM_CONFIG_STORE_DIR="$store_root" pnpm store path --silent)
          echo "path=$store_path" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-node-${{ env.PRIMARY_NODE_VERSION }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ env.PRIMARY_NODE_VERSION }}-pnpm-

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      # The ledger gate checks the pushed range, from the tip before this push.
      # A manual run has no such tip and a push that created the branch names
      # all zeros; the gate then checks only that the head's ledger parses.
      - name: Run static gates
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [[ -n "$PUSH_BEFORE" && ! "$PUSH_BEFORE" =~ ^0+$ ]]; then
            export DSH_LEDGER_BASE_REF="$PUSH_BEFORE"
          fi
          pnpm run check:ci:static

  coverage:
    runs-on: ubuntu-latest
    name: node 24 / coverage
    timeout-minutes: 150
    permissions:
      contents: read
    env:
      DSH_COVERAGE_MAX_WORKERS: '3'
      DSH_GATE_CONCURRENCY: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Configure pnpm store path
        id: pnpm-store
        run: |
          store_root="$HOME/.local/share/pnpm/store"
          echo "PNPM_CONFIG_STORE_DIR=$store_root" >> "$GITHUB_ENV"
          store_path=$(PNPM_CONFIG_STORE_DIR="$store_root" pnpm store path --silent)
          echo "path=$store_path" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-node-${{ env.PRIMARY_NODE_VERSION }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ env.PRIMARY_NODE_VERSION }}-pnpm-

      - name: Install dependencies and prepare bubblewrap
        run: |
          pnpm install --frozen-lockfile &
          install_pid=$!
          bash scripts/prepare-ci-bubblewrap.sh &
          sandbox_pid=$!
          install_status=0
          wait "$install_pid" || install_status=$?
          sandbox_status=0
          wait "$sandbox_pid" || sandbox_status=$?
          if (( install_status != 0 )); then exit "$install_status"; fi
          exit "$sandbox_status"

      - name: Run exhaustive coverage
        run: pnpm run check:ci:coverage

  consumers:
    runs-on: ubuntu-latest
    name: node 24 / snapshots and artifacts
    timeout-minutes: 150
    permissions:
      contents: read
    env:
      # One gate at a time: the browser suites in this group time out when a
      # second gate's build shares the four cores.
      DSH_GATE_CONCURRENCY: '1'
      DSH_NODE_COMPAT_SKIP_TYPECHECK: '1'
      DSH_OXLINT_THREADS: '2'
      DSH_PUBLINT_CONCURRENCY: '2'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Configure pnpm store path
        id: pnpm-store
        run: |
          store_root="$HOME/.local/share/pnpm/store"
          echo "PNPM_CONFIG_STORE_DIR=$store_root" >> "$GITHUB_ENV"
          store_path=$(PNPM_CONFIG_STORE_DIR="$store_root" pnpm store path --silent)
          echo "path=$store_path" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-node-${{ env.PRIMARY_NODE_VERSION }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ env.PRIMARY_NODE_VERSION }}-pnpm-

      - name: Install dependencies and prepare bubblewrap
        run: |
          pnpm install --frozen-lockfile &
          install_pid=$!
          bash scripts/prepare-ci-bubblewrap.sh &
          sandbox_pid=$!
          install_status=0
          wait "$install_pid" || install_status=$?
          sandbox_status=0
          wait "$sandbox_pid" || sandbox_status=$?
          if (( install_status != 0 )); then exit "$install_status"; fi
          exit "$sandbox_status"

      - name: Install Playwright Chromium and hosted dependencies
        run: pnpm --filter @deepseek-ai/dsh-web-frontend exec playwright install --with-deps chromium

      - name: Run compatibility, snapshot, and artifact gates
        run: pnpm run check:ci:consumers
